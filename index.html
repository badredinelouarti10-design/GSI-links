<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GSI – Links</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        /* =========================
           DESKTOP
           ========================= */

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 60px 30px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 42px;
        }

        .description {
            margin: 0 0 45px;
            font-size: 20px;
            color: #555;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 80px;

            margin: 22px 0;
            padding: 20px;

            background: white;
            color: black;

            text-decoration: none;
            font-size: 22px;
            font-weight: bold;

            border-radius: 14px;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);

            transition: transform 0.15s;
        }

        .link:hover {
            transform: translateY(-2px);
        }

        .link:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 50px;
            font-size: 15px;
            color: #777;
        }


        /* =========================
           HANDY
           ========================= */

        @media (max-width: 600px) {

            body {
                background: #f5f5f5;
            }

            .container {
                width: 100%;
                max-width: none;

                /* sehr wenig Rand links/rechts */
                padding: 45px 6px;
            }

            h1 {
                font-size: 42px;
                margin-bottom: 12px;
            }

            .description {
                font-size: 21px;
                margin-bottom: 40px;
            }

            .link {
                width: 100%;

                /* große Buttons */
                min-height: 100px;

                margin: 20px 0;
                padding: 20px 10px;

                font-size: 24px;

                border-radius: 16px;

                box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
            }

            .footer {
                margin-top: 45px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>GSI</h1>

        <p class="description">
            Connect with us
        </p>

        <a
            class="link"
            href="https://www.gsi.de/start/aktuelles"
            target="_blank"
            rel="noopener noreferrer">
            🌐 GSI Website
        </a>

        <a
            class="link"
            href="https://www.instagram.com/universeinthelab"
            target="_blank"
            rel="noopener noreferrer">
            📸 Instagram
        </a>

        <a
            class="link"
            href="https://www.linkedin.com/company/gsi-helmholtz-centre-for-heavy-ion-research/home/"
            target="_blank"
            rel="noopener noreferrer">
            💼 LinkedIn
        </a>

        <div class="footer">
            © GSI
        </div>

    </div>

</body>
</html>

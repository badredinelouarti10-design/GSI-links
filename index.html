<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GSI – Links</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            margin: 10px 0;
            font-size: 28px;
        }

        .description {
            font-size: 16px;
            margin: 0 0 30px;
            color: #555;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 60px;

            margin: 15px 0;
            padding: 15px 20px;

            background: white;
            color: #111;

            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            border-radius: 12px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);

            transition: transform 0.15s;
        }

        .link:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #777;
        }

        /* Extra Anpassung für sehr kleine Handys */
        @media (max-width: 400px) {
            .container {
                padding: 30px 15px;
            }

            h1 {
                font-size: 24px;
            }

            .link {
                min-height: 56px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            GSI
        </div>

        <h1>GSI</h1>

        <p class="description">
            Connect with us
        </p>

        <a class="link"
           href="https://www.gsi.de/start/aktuelles"
           target="_blank">
            🌐 GSI Website
        </a>

        <a class="link"
           href="https://www.instagram.com/universeinthelab"
           target="_blank">
            📸 Instagram
        </a>

        <a class="link"
           href="https://www.linkedin.com/company/gsi-helmholtz-centre-for-heavy-ion-research/"
           target="_blank">
            💼 LinkedIn
        </a>

        <div class="footer">
            © GSI
        </div>

    </div>

</body>
</html>

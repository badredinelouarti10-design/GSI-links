<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <!-- Passt die Seite automatisch an Handy, Tablet und Desktop an -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GSI – Links</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            margin: 10px 0;
            font-size: 28px;
        }

        .description {
            margin: 0 0 30px;
            font-size: 16px;
            color: #555;
        }

        .link {
            display: block;
            width: 100%;
            padding: 16px 20px;
            margin: 15px 0;

            background: white;
            color: black;

            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            transition: transform 0.15s;
        }

        .link:hover {
            transform: translateY(-2px);
        }

        .link:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #777;
        }

        /*
         * Handy:
         * Das Design bleibt gleich, aber die Abstände
         * werden etwas kleiner, damit alles bequem auf
         * den Bildschirm passt.
         */
        @media (max-width: 600px) {

            .container {
                padding: 30px 15px;
            }

            h1 {
                font-size: 26px;
            }

            .description {
                margin-bottom: 25px;
            }

            .link {
                padding: 15px;
                margin: 12px 0;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>GSI</h1>

        <p class="description">
            Connect with us
        </p>

        <!-- GSI WEBSITE -->
        <a
            class="link"
            href="https://www.gsi.de/start/aktuelles"
            target="_blank"
            rel="noopener noreferrer">
            🌐 GSI Website
        </a>

        <!-- INSTAGRAM -->
        <a
            class="link"
            href="https://www.instagram.com/universeinthelab"
            target="_blank"
            rel="noopener noreferrer">
            📸 Instagram
        </a>

        <!-- LINKEDIN -->
        <a
            class="link"
            href="https://www.linkedin.com/company/gsi-helmholtz-centre-for-heavy-ion-research/home/"
            target="_blank"
            rel="noopener noreferrer">
            💼 LinkedIn
        </a>

        <div class="footer">
            © GSI
        </div>

    </div>

</body>
</html>
